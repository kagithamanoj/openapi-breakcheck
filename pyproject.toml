[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-breakcheck"
version = "0.1.0"
description = "Detect breaking changes between two OpenAPI 3.x specifications."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyyaml"]
authors = [{ name = "Manoj Kumar Kagitha" }]

[project.scripts]
openapi-breakcheck = "breakcheck.cli:main"

[tool.setuptools.packages.find]
include = ["breakcheck*"]
